
# ============================================================================
# Project Tracking board
#
# Edit this file and the wall repaints within about a second — no restart.
# You can also split projects across several .yaml/.json files in this folder;
# they all merge into one board.
#
# Required per project: title
# Everything else is optional and falls back to something sensible.
#
#   status      Backlog | In Progress | Blocked | In Review | Done
#               (free text also works: "wip", "qa", "on hold", "shipped"…)
#   owner       shown as initials + name on the card
#   progress    0-100. Omit it and progress is derived from milestones,
#               or from the column if there are none.
#   due         YYYY-MM-DD. Drives the "3d left" / "overdue" badge.
#   health      on-track | at-risk | off-track. Omit it and health is derived
#               from the due date and progress.
#   priority    critical | high | medium | low  (p0/p1/p2/p3 also accepted)
#   milestones  the first unfinished one shows on the card as "Next: …"
# ============================================================================

board:
  name: Engineering Delivery
  columns:
    - Backlog
    - In Progress
    - Blocked
    - In Review
    - Done

