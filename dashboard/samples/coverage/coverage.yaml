# ============================================================================
# Daily area coverage
#
# Who is covering which area today. Drag an engineer between areas on the wall
# and this file updates itself; or edit it here and the wall repaints within
# about a second -- no restart.
#
#   areas       the columns, in the order they appear on the wall
#   engineers   one entry per person: a name and the area they are covering.
#               An engineer's area must be one of the areas above. Leave the
#               area blank (or drag the card to "Off / Unassigned") for anyone
#               off today; an unrecognised area also lands there.
# ============================================================================

coverage:
  areas:
    - Perimeter
    - HD JOE
    - Downtown
    - On-Call
    - Special project
    - Off / Unassigned
  engineers:
    - name: KC
      area: Perimeter
    - name: Berry
      area: HD JOE
    - name: Steve
      area: Downtown
    - name: Jam
      area: On-Call
    - name: Trey
      area: Special project
